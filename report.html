<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>树洞 · 家长报告</title>
<style>
body{margin:0;font:17px/1.6 -apple-system,"PingFang SC",sans-serif;background:#f7f4ff;color:#2d2a4a;padding:18px;max-width:760px;margin:auto}
h1{font-size:24px;margin:6px 0 14px}h2{font-size:19px;margin:24px 0 8px}
.card{background:#fff;border-radius:16px;padding:14px 16px;margin:10px 0;box-shadow:0 2px 8px #0001}
.red{border-left:6px solid #e53935}.yellow{border-left:6px solid #f9a825}
.trend{display:flex;gap:6px;flex-wrap:wrap}.trend div{text-align:center;font-size:13px;color:#888;background:#fff;border-radius:12px;padding:6px 8px;min-width:54px}
.trend b{display:block;font-size:26px}
input,button{font:inherit;padding:10px 14px;border-radius:12px;border:1px solid #ccc}button{background:#6c4cd6;color:#fff;border:0}
.muted{color:#888;font-size:14px}.k{color:#6c4cd6;font-weight:600}
</style></head><body>
<h1>🌳 阳光树洞 · 家长报告</h1>
<div id="login" class="card">输入家长密码：<input id="pin" type="password" inputmode="numeric" style="width:120px"> <button id="go">查看</button><div class="muted" id="err"></div></div>
<div id="out"></div>
<script>
const Q = new URLSearchParams(location.search); if (Q.get('w')) localStorage.setItem('nzw', Q.get('w'));
const W = (localStorage.getItem('nzw') || 'https://nizi-shudong.daijiali777.workers.dev').replace(/\/$/, '');
const EMO = { happy: '😊', calm: '🙂', sad: '😢', angry: '😠', worried: '😟', jealous: '😤', scared: '😨', mixed: '🤔' };
const ZH = { happy: '开心', calm: '平静', sad: '难过', angry: '生气', worried: '担心', jealous: '嫉妒', scared: '害怕', mixed: '复杂' };
const esc = s => String(s || '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

const GOOD = { happy: 3, calm: 2, mixed: 1, jealous: 0, worried: 0, sad: 0, angry: 0, scared: 0 };
function plain(j) {
  if (!j.days.length) return '这几天她还没去树洞说话。';
  const d = j.days[0], it = d.items, n = it.length, today = new Date().toLocaleDateString('sv') === d.d;
  const c = {}; it.forEach(i => c[i.mood] = (c[i.mood] || 0) + 1);
  const ms = Object.entries(c).sort((a, b) => b[1] - a[1]);
  const mood = ms.map(([m, k], x) => (x === 0 && k > n / 2 ? '大部分时候' : '') + (ZH[m] || m) + '（' + k + '句）').join('，');
  const ts = it.map(i => i.ts.slice(-5)).sort();
  const first = it.slice().sort((a, b) => a.ts < b.ts ? -1 : 1), a = first[0], z = first[n - 1];
  let turn = '';
  if (n > 2) { const g0 = GOOD[a.mood] ?? 1, g1 = GOOD[z.mood] ?? 1; turn = g1 > g0 ? '聊到最后，心情好一些了。' : g1 < g0 ? '聊到最后心情反而差了一点，可以多留意。' : ''; }
  const tp = []; it.forEach(i => { const t = (i.topic || '').trim(); if (t && !tp.includes(t)) tp.push(t); });
  const al = j.alerts.filter(x => (x.ts || '').startsWith(d.d)).length, ye = it.filter(i => i.risk === 'yellow').length;
  let h = `<b>${today ? '今天' : d.d.slice(5).replace('-', '月') + '日'}</b>（${ts[0]}${ts.length > 1 ? '–' + ts[ts.length - 1] : ''}）她跟宠物说了 <b>${n} 句</b>，心情：${mood}。${turn}`;
  if (tp.length) h += `<br>说的主要是：<b>${tp.slice(0, 6).map(esc).join('、')}</b>。`;
  h += '<br>' + (al ? `<span style="color:#e53935">⚠️ 有 ${al} 件需要你关注，看下面红色的卡片。</span>` : ye ? `有 ${ye} 句值得留意一下（下面带黄色竖线的）。没有不安全的事。` : '✅ 没有说到不安全的事。');
  const wk = j.days.slice(0, 7); if (wk.length > 1) { const all = {}; let t = 0; wk.forEach(x => x.items.forEach(i => { all[i.mood] = (all[i.mood] || 0) + 1; t++; })); const top = Object.entries(all).sort((a, b) => b[1] - a[1])[0]; h += `<br><span class="muted">最近 ${wk.length} 天里有聊天，一共 ${t} 句，最多的心情是「${ZH[top[0]] || top[0]}」。</span>`; }
  const sad = it.filter(i => ['sad', 'angry', 'worried', 'scared', 'jealous'].includes(i.mood)).length;
  if (sad > n / 2) h += '<br>💛 她今天不太开心的时候比较多，抱抱她、听她把话说完，比讲道理更管用。';
  return h;
}
async function load(pin) {
  const r = await fetch(W + '/report', { headers: { 'X-Pin': pin } }); const j = await r.json();
  if (j.error) { document.getElementById('err').textContent = '密码不对'; return; }
  localStorage.setItem('nzpin', pin); document.getElementById('login').style.display = 'none';
  let h = '';
  if (j.alerts.length) { h += '<h2>🚨 需要你关注</h2>'; j.alerts.slice().reverse().forEach(a => h += `<div class="card red"><div class="muted">${esc(a.ts)}</div><div>${esc(a.summary)}</div><div class="muted">她说：「${esc(a.said)}」<br>宠物回答：「${esc(a.reply)}」</div></div>`); }
  h += '<h2>📈 最近的心情</h2><div class="trend">';
  j.days.slice(0, 14).reverse().forEach(d => { const c = {}; d.items.forEach(i => c[i.mood] = (c[i.mood] || 0) + 1); const top = Object.entries(c).sort((a, b) => b[1] - a[1])[0]; h += `<div><b>${EMO[top && top[0]] || '·'}</b>${d.d.slice(5)}<br>${d.items.length}句</div>`; });
  h += '</div>';
  h += '<h2>📝 每天聊了什么（概括）</h2>';
  j.days.forEach(d => { const seen = new Set(); h += `<div class="card"><div class="k">${d.d}</div>`; d.items.forEach(i => { const key = i.summary; if (seen.has(key)) return; seen.add(key); h += `<div class="${i.risk === 'yellow' ? 'yellow' : ''}" style="padding-left:8px;margin:4px 0">${EMO[i.mood] || ''} <span class="muted">${esc(i.ts.slice(-5))} · ${esc(i.topic)}</span><br>${esc(i.summary)}</div>`; }); h += '</div>'; });
  if (j.gifts.length) { h += '<h2>💌 她送给你的悄悄话</h2>'; j.gifts.slice().reverse().forEach(g => { h += `<div class="card"><div class="muted">${esc(g.ts)}</div>`; g.lines.forEach(l => h += `<div>${l.r === 'k' ? '<b>Nizi：</b>' : '<span class="muted">宠物：</span>'}${esc(l.t)}</div>`); h += '</div>'; }); }
  if (!j.days.length) h += '<div class="card muted">还没有对话记录。</div>';
  h = `<h2>🧸 大白话总结</h2><div class="card" style="border-left:6px solid #6c4cd6">${plain(j)}</div><h2>💡 可以对 Nizi 说的话</h2><div class="card"><div id="sug" class="muted">正在想…</div><button id="sugN" style="margin-top:10px">换一批</button></div>
  <h2>🎙 给 Nizi 留一段悄悄话</h2><div class="card"><div class="muted">按住按钮说话，松开就录好了。Nizi 下次进树洞时，小鸭会先放给她听。</div>
  <button id="rec" style="margin-top:10px;font-size:20px;padding:14px 24px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none">按住录音</button> <span id="recS" class="muted">${j.mom ? (j.mom.played ? '上一段（' + esc(j.mom.ts) + '）她已经听过了' : '已录好一段（' + esc(j.mom.ts) + '），她还没听') : ''}</span></div>` + h +
  `<h2>📧 提醒邮件</h2><div class="card"><div class="muted">如果她说到不安全的事，会发邮件到 davinadnz@gmail.com。</div><button id="atest" style="margin-top:10px">发一封测试邮件</button> <span id="atS" class="muted"></span></div>`;
  document.getElementById('out').innerHTML = h;
  const P = localStorage.getItem('nzpin');
  const sug = async n => { document.getElementById('sug').textContent = '正在想…'; try { const r = await (await fetch(W + '/suggest' + (n ? '?new=1' : ''), { headers: { 'X-Pin': P } })).json(); document.getElementById('sug').style.whiteSpace = 'pre-wrap'; document.getElementById('sug').style.color = '#2d2a4a'; document.getElementById('sug').textContent = r.text || '暂时想不出来，稍后再试。'; } catch (e) { document.getElementById('sug').textContent = '网络不太好，稍后再试。'; } };
  sug(); document.getElementById('sugN').onclick = () => sug(1);
  document.getElementById('atest').onclick = async () => { await fetch(W + '/alerttest', { headers: { 'X-Pin': P } }); document.getElementById('atS').textContent = '已发送，几分钟内查收（也看看垃圾邮件）'; };
  let rec, ch = [], st, t0; const b = document.getElementById('rec'), S = document.getElementById('recS');
  b.addEventListener('contextmenu', e => e.preventDefault()); b.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
  b.addEventListener('pointerdown', async e => { e.preventDefault(); try { st = st || await navigator.mediaDevices.getUserMedia({ audio: true }); ch = []; rec = new MediaRecorder(st); rec.ondataavailable = x => ch.push(x.data); rec.onstop = async () => { if (Date.now() - t0 < 1000) { S.textContent = '太短啦，要按住说话'; return; } const bl = new Blob(ch, { type: rec.mimeType }); const fr = new FileReader(); fr.onload = async () => { S.textContent = '正在保存…'; const r = await (await fetch(W + '/momsg', { method: 'POST', headers: { 'X-Pin': P, 'Content-Type': 'application/json' }, body: JSON.stringify({ audio: fr.result.split(',')[1], mime: rec.mimeType }) })).json(); S.textContent = r.ok ? '✅ 录好了！Nizi 下次进树洞会听到' : '保存失败，再试一次'; }; fr.readAsDataURL(bl); }; rec.start(); t0 = Date.now(); b.textContent = '🔴 正在录…松开结束'; } catch (err) { S.textContent = '麦克风打不开'; } });
  const stop = e => { e.preventDefault(); if (rec && rec.state === 'recording') { rec.stop(); b.textContent = '按住录音'; } };
  b.addEventListener('pointerup', stop); b.addEventListener('pointerleave', stop);
}
document.getElementById('go').onclick = () => load(document.getElementById('pin').value);
if (localStorage.getItem('nzpin')) load(localStorage.getItem('nzpin'));
</script></body></html>
