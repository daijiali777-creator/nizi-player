<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>选声音</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;padding:22px;font:20px -apple-system,"PingFang SC",sans-serif;background:linear-gradient(#fff3f8,#eef6ff);color:#3a2d5c;text-align:center}
h1{font-size:28px;margin:6px 0 4px}h2{font-size:21px;margin:26px 0 12px;color:#7a5fd1}p{margin:0 0 18px;color:#7a6f99;font-size:18px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:16px;max-width:900px;margin:auto}
.c{border:0;border-radius:28px;background:var(--c);height:130px;box-shadow:0 7px 0 rgba(0,0,0,.15);font:inherit;color:#fff;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.c b{font-size:46px;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.c:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.w{display:flex;gap:4px;height:22px;align-items:center}.w i{display:block;width:6px;height:8px;border-radius:3px;background:#fff}
.c.on{outline:5px solid #3a2d5c}.c.on .w i{animation:wv .5s ease-in-out infinite}.c.on .w i:nth-child(2){animation-delay:.1s}.c.on .w i:nth-child(3){animation-delay:.2s}.c.on .w i:nth-child(4){animation-delay:.3s}
@keyframes wv{50%{height:22px}}</style></head><body>
<h1>小鸭的新声音</h1><p>点一点，听听哪个声音最可爱，记住它的数字</p><h2>新的宝宝音</h2><div class="g"><button class="c" style="--c:#ff8fb1" data-i="18"><b>18</b><i class="w"><i></i><i></i><i></i><i></i></i></button><button class="c" style="--c:#ffb86b" data-i="19"><b>19</b><i class="w"><i></i><i></i><i></i><i></i></i></button><button class="c" style="--c:#ffd84d" data-i="20"><b>20</b><i class="w"><i></i><i></i><i></i><i></i></i></button><button class="c" style="--c:#8fd694" data-i="21"><b>21</b><i class="w"><i></i><i></i><i></i><i></i></i></button><button class="c" style="--c:#6cc6ff" data-i="22"><b>22</b><i class="w"><i></i><i></i><i></i><i></i></i></button><button class="c" style="--c:#b89cff" data-i="23"><b>23</b><i class="w"><i></i><i></i><i></i><i></i></i></button><button class="c" style="--c:#ff9e9e" data-i="24"><b>24</b><i class="w"><i></i><i></i><i></i><i></i></i></button><button class="c" style="--c:#7ee0d1" data-i="25"><b>25</b><i class="w"><i></i><i></i><i></i><i></i></i></button></div><h2>你上次选的</h2><div class="g"><button class="c" style="--c:#b89cff" data-i="06"><b>6</b><i class="w"><i></i><i></i><i></i><i></i></i></button><button class="c" style="--c:#f7a8e0" data-i="09"><b>9</b><i class="w"><i></i><i></i><i></i><i></i></i></button><button class="c" style="--c:#a8d86e" data-i="10"><b>10</b><i class="w"><i></i><i></i><i></i><i></i></i></button><button class="c" style="--c:#c3a3ff" data-i="14"><b>14</b><i class="w"><i></i><i></i><i></i><i></i></i></button><button class="c" style="--c:#ffb3c7" data-i="16"><b>16</b><i class="w"><i></i><i></i><i></i><i></i></i></button></div><h2>其他</h2><div class="g"><button class="c" style="--c:#ff8fb1" data-i="01"><b>1</b><i class="w"><i></i><i></i><i></i><i></i></i></button><button class="c" style="--c:#ffb86b" data-i="02"><b>2</b><i class="w"><i></i><i></i><i></i><i></i></i></button><button class="c" style="--c:#ffd84d" data-i="03"><b>3</b><i class="w"><i></i><i></i><i></i><i></i></i></button><button class="c" style="--c:#8fd694" data-i="04"><b>4</b><i class="w"><i></i><i></i><i></i><i></i></i></button><button class="c" style="--c:#6cc6ff" data-i="05"><b>5</b><i class="w"><i></i><i></i><i></i><i></i></i></button><button class="c" style="--c:#ff9e9e" data-i="07"><b>7</b><i class="w"><i></i><i></i><i></i><i></i></i></button><button class="c" style="--c:#7ee0d1" data-i="08"><b>8</b><i class="w"><i></i><i></i><i></i><i></i></i></button><button class="c" style="--c:#ffc48c" data-i="11"><b>11</b><i class="w"><i></i><i></i><i></i><i></i></i></button><button class="c" style="--c:#9ab8ff" data-i="12"><b>12</b><i class="w"><i></i><i></i><i></i><i></i></i></button><button class="c" style="--c:#ff7fa2" data-i="13"><b>13</b><i class="w"><i></i><i></i><i></i><i></i></i></button><button class="c" style="--c:#64d2b3" data-i="15"><b>15</b><i class="w"><i></i><i></i><i></i><i></i></i></button><button class="c" style="--c:#f4c542" data-i="17"><b>17</b><i class="w"><i></i><i></i><i></i><i></i></i></button></div><script>const a=new Audio();let cur;document.querySelectorAll('.c').forEach(b=>b.onclick=()=>{if(cur)cur.classList.remove('on');cur=b;b.classList.add('on');a.src='vs/v'+b.dataset.i+'.mp3?r=2';a.play();});a.onended=()=>{if(cur)cur.classList.remove('on')};</script></body></html>
